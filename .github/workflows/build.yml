name: Verify builds

'on':
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            preset: gcc-release
            plugin: libmisc_script.so
          - platform: win-x64
            preset: mingwcross-release
            plugin: misc_script.dll

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential cmake pkg-config mingw-w64 ruby rake \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}" -B "scratch/ci-${{ matrix.platform }}"

      - name: Build cards, tools, and examples
        run: cmake --build "scratch/ci-${{ matrix.platform }}" --parallel 4

      - name: Verify script plugin output
        run: test -f "scratch/ci-${{ matrix.platform }}/plugins/${{ matrix.plugin }}"
